name: team_logger
description: A logging library for big teams, big applications and huge logs.
version: 0.7.0
repository: https://github.com/vi-k/team_logger
issue_tracker: https://github.com/vi-k/team_logger/issues
topics:
  - logger
  - logging
  - log
  - console
  - tracing

# Shown as a carousel on the package page and in search results. Built from
# the frame pipeline by `scripts/gallery.sh` — lossless WebP, so the archive
# pays 76 KB rather than the 428 the same four PNGs would cost.
screenshots:
  - description: >-
      A console log: sequence number, level, time, namespace path, trace id
      and message in columns, with tags right-aligned in the row's tail.
    path: gallery/quick_start_1.webp
  - description: >-
      Structured data in one log: nested maps, a list with its length, and
      bracket colours that shift with the nesting depth.
    path: gallery/gallery_1.webp
  - description: >-
      An object that decides how it prints itself, with a nested object, a
      unit suffix on a number and a counted list.
    path: gallery/gallery_2.webp
  - description: >-
      A trace id following an asynchronous operation, tying its logs together
      so they can be filtered as one.
    path: gallery/trace_1.webp

environment:
  sdk: ^3.6.0

dependencies:
  ansi_escape_codes: ^4.0.1
  # Grapheme clusters for the display-width model: a terminal column is not
  # a UTF-16 code unit, and splitting text anywhere but a cluster boundary
  # breaks combining sequences and ZWJ emoji. Not ^1.4.0: Flutter 3.27 — the
  # line carrying the Dart 3.6 floor above — pins characters 1.3.0, and a
  # floor above that pin is a version-solving failure there. That is the
  # exact trap `format` ^1.6.0 fell into before 0.7.0 dropped it.
  characters: ^1.3.0
  # clock, meta and stack_trace come out of the Flutter SDK, which pins them
  # to an *exact* version, so a floor above that pin is a version-solving
  # failure on that Flutter — not a newer resolve. Flutter 3.27, the line
  # carrying Dart 3.6 (the floor declared above), pins clock 1.1.1,
  # meta 1.15.0 and stack_trace 1.12.0, and these floors are those pins.
  # Nothing here needs anything newer: `clock.now()`, `Trace`/`Chain`, and
  # the `@internal`, `@nonVirtual` and `@visibleForTesting` annotations all
  # predate them.
  clock: ^1.1.1
  logger_builder: ^0.8.0
  meta: ^1.15.0
  stack_trace: ^1.12.0

dev_dependencies:
  # Tests only: `lib/` formats no numbers of its own — a pattern is executed
  # by the theme's `numberFormatter`, which the application installs. The
  # tests pin exactly the recipe the README documents.
  format: ^4.1.0
  # Not ^6.1.0: lints 6 needs Dart ^3.8.0, and a dev dependency that cannot
  # resolve on the declared floor takes `pub get` on Dart 3.6 with it — the
  # one SDK on which this package must still be checkable. The range gives
  # 6.x to whoever develops on a current SDK and 5.1.1 on the floor.
  lints: '>=5.0.0 <7.0.0'
  test: ^1.24.0
