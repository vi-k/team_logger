name: team_logger
description: A logging library for big teams, big applications and huge logs.
version: 0.7.0
repository: https://github.com/vi-k/team_logger
issue_tracker: https://github.com/vi-k/team_logger/issues
topics:
  - logger
  - logging
  - log
  - console
  - tracing

environment:
  sdk: ^3.6.0

dependencies:
  ansi_escape_codes: ^4.0.1
  archive: ^4.0.9
  clock: ^1.1.2
  format: ^1.6.0
  logger_builder: ^0.6.1
  meta: ^1.16.0
  stack_trace: ^1.12.1

dev_dependencies:
  lints: ^5.0.0
  test: ^1.24.0
